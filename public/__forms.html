<!DOCTYPE html>
<html>
  <body>
    <!-- This file exists only so Netlify's build bot can detect and register these forms. -->
    <!-- It is never shown to users; the real forms are rendered by React. -->
    <form name="reservation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="reservation" />
      <input name="dropoffLocation" />
      <input name="pickupLocation" />
      <input name="package" />
      <input name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input name="deliveryAddress" />
      <input name="pickupAddress" />
      <input type="date" name="preferredDate" />
      <textarea name="notes"></textarea>
      <input name="bot-field" />
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
